# Prometheus scrape configuration — Personal AI-Powered APM System
#
# Requirements traceability:
#   1.2 — scrape Monitored_App at a configurable interval 5-60s (default 15s)
#   1.3 — scrape timeout configurable 1-10s (default 10s); on timeout the target
#         is marked down and previously collected series are retained (Prometheus
#         does this by default — a failed scrape never deletes prior samples)
#   1.4 — scrape Node Exporter at the same configured interval as the app
#   1.5 — scrape cAdvisor (per-container metrics) at the same configured interval
#   2.7 — an unreachable source is recorded as a failed scrape (target = down);
#         the `up` metric flips to 0 and prior samples are retained
#
# CONFIGURABILITY NOTE:
#   Prometheus does not expand environment variables inside this file, so the
#   scrape_interval / scrape_timeout below are set to their documented defaults.
#   To reconfigure within the allowed ranges, edit the values here and reload
#   Prometheus (SIGHUP or POST /-/reload):
#     - scrape_interval : any value in [5s, 60s]  (default 15s)
#     - scrape_timeout  : any value in [1s, 10s]  (default 10s), <= scrape_interval
#   Every job below inherits these globals, so a single edit re-times the app,
#   Node Exporter, and cAdvisor together (Requirements 1.4, 1.5).

global:
  # Default collection interval for every job (Requirements 1.2, 2.1). Range 5s-60s.
  scrape_interval: 15s
  # Default per-scrape timeout (Requirement 1.3). Range 1s-10s; must be <= scrape_interval.
  scrape_timeout: 10s
  # How often alerting/recording rules are evaluated. Kept at the scrape cadence.
  evaluation_interval: 15s

scrape_configs:
  # --- Monitored application (OpenTelemetry SDK / Prometheus client) ---
  # Exposes /metrics in Prometheus text exposition format (Requirement 1.1).
  # Uses the Docker Compose service name so DNS resolves inside the compose network.
  - job_name: target-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - target-app:9464
        labels:
          component: monitored-app

  # --- Host-level metrics (Requirement 1.4) ---
  # Node Exporter emits CPU, memory, disk on its default port 9100.
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          component: host

  # --- Per-container metrics (Requirement 1.5) ---
  # cAdvisor emits per-container CPU/memory/network on its default port 8080.
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          component: container
